camera:
  # Use device_id (int) for camera, or source (string path) for video file
  source: "data/dataset.mp4"
  # source: 0
  device_id: 0
  resolution:
    width: 640
    height: 480
  fps: 15
  frame_timeout_ms: 2000
system:
  log_level: INFO
  log_file: logs/dms.log

# Bật/tắt từng model trong pipeline.
# face_detector luôn bắt buộc (các model khác phụ thuộc bbox của nó).
models:
  facemap: true          # FaceMap 3DMM landmark
  attrib: false           # Facial attribute (eyes/glasses/mask...)
  head_pose: true       # MobileNetV2 head pose
  analyzer: false         # Drowsiness analyzer
  visualizer: true       # Hiển thị cửa sổ OpenCV
